<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Emerald Brand Gradients -->
    <linearGradient id="af-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.2" />
    </linearGradient>

    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring (Rotating Animation) -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 32 32" 
      to="360 32 32" 
      dur="7s" 
      repeatCount="indefinite" 
    />
    <rect 
      x="7" y="7" width="50" height="50" rx="16" 
      fill="none" 
      stroke="url(#glow-grad)" 
      stroke-width="1.8" 
      stroke-dasharray="14 10" 
      opacity="0.75"
    />
  </g>

  <!-- Main Squircle Backdrop -->
  <rect x="8" y="8" width="48" height="48" rx="14" fill="#05090f" stroke="url(#af-grad)" stroke-width="2.5" />
  
  <!-- Subtle Internal Glow Overlay -->
  <rect x="9" y="9" width="46" height="46" rx="13" fill="#081422" opacity="0.9" />

  <!-- Orbiting Moving Electron Particle -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 32 32" 
      to="360 32 32" 
      dur="3.2s" 
      repeatCount="indefinite" 
    />
    <circle cx="32" cy="7" r="3.2" fill="#6ee7b7" filter="url(#emerald-glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Interconnected Network Node Structure -->
  <g filter="url(#soft-glow)">
    <!-- Connecting Circuit Lines -->
    <!-- Top to Hub -->
    <line x1="32" y1="20" x2="32" y2="31" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" />
    <!-- Hub to Bottom-Left -->
    <line x1="32" y1="31" x2="22" y2="43" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" />
    <!-- Hub to Bottom-Right -->
    <line x1="32" y1="31" x2="42" y2="43" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" />
    <!-- Horizontal Cross-Link -->
    <line x1="22" y1="43" x2="42" y2="43" stroke="#059669" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.8" />

    <!-- Moving Signal Packet 1 (Top -> Hub) -->
    <circle r="2" fill="#ffffff">
      <animate attributeName="cx" values="32;32;32" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="20;31;20" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Moving Signal Packet 2 (Hub -> Bottom Right) -->
    <circle r="1.8" fill="#6ee7b7">
      <animate attributeName="cx" values="32;42;32" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="31;43;31" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 1: Top (Master Node) -->
    <rect x="27.5" y="15.5" width="9" height="9" rx="2.5" fill="#04080e" stroke="#34d399" stroke-width="2">
      <animate attributeName="stroke" values="#34d399;#6ee7b7;#34d399" dur="2s" repeatCount="indefinite" />
    </rect>
    <circle cx="32" cy="20" r="2" fill="#34d399">
      <animate attributeName="r" values="1.6;2.4;1.6" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Center Junction Node (Hub) -->
    <circle cx="32" cy="31" r="3.6" fill="#10b981" stroke="#ffffff" stroke-width="1.5">
      <animate attributeName="r" values="3.2;4.2;3.2" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#10b981;#34d399;#10b981" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Node 2: Bottom-Left -->
    <rect x="17.5" y="38.5" width="9" height="9" rx="2.5" fill="#04080e" stroke="#10b981" stroke-width="2" />
    <circle cx="22" cy="43" r="1.8" fill="#10b981">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 3: Bottom-Right -->
    <rect x="37.5" y="38.5" width="9" height="9" rx="2.5" fill="#04080e" stroke="#10b981" stroke-width="2" />
    <circle cx="42" cy="43" r="1.8" fill="#10b981">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>